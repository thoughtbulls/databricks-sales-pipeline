name: Deploy to Databricks

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: databricks

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Databricks CLI (legacy 0.18.0)
        run: |
          pip uninstall -y databricks databricks-cli || true
          pip install databricks-cli==0.18.0

      - name: Show Databricks CLI version
        run: |
          databricks --version

      - name: Verify job exists
        run: |
          databricks jobs get --job-id $DATABRICKS_JOB_ID

      - name: Clean Databricks workspace folder
        run: |
          databricks workspace delete /Shared/databricks-sales-pipeline --recursive || true
          databricks workspace mkdirs /Shared/databricks-sales-pipeline

      - name: Upload notebooks to Databricks Workspace
        run: |
          databricks workspace import_dir notebooks /Shared/databricks-sales-pipeline/notebooks -o
      
      - name: Upload src to Databricks Workspace
        run: |
          databricks workspace import_dir src /Shared/databricks-sales-pipeline/src -o

      - name: Upload config files to Volume
        run: |
          databricks fs cp configs/dev.yaml dbfs:/Volumes/dev_catalog/pipelines/configs/dev.yaml --overwrite

      - name: Update job api version to 2.1
        run: |
          databricks jobs configure --version=2.1

      - name: Update Databricks Job
        run: |
          echo "Updating job id: $DATABRICKS_JOB_ID"
          databricks jobs reset --job-id $DATABRICKS_JOB_ID --json-file workflows/job.json
