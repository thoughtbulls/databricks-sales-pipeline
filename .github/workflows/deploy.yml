name: Deploy to Databricks

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: databricks

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Databricks CLI (NEW)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sudo sh

      - name: Show Databricks CLI version
        run: databricks version

      # ---- VERIFY AUTH & JOB ----
      - name: Verify job exists
        run: |
          databricks jobs get $DATABRICKS_JOB_ID

      # ---- WORKSPACE DEPLOY ----
      - name: Clean Databricks workspace folder
        run: |
          databricks workspace delete /Shared/databricks-sales-pipeline --recursive || true
          databricks workspace mkdirs /Shared/databricks-sales-pipeline

      - name: Upload notebooks to Databricks Workspace
        run: |
          databricks workspace import-dir notebooks \
            /Shared/databricks-sales-pipeline/notebooks --overwrite

      - name: Upload src to Databricks Workspace
        run: |
          databricks workspace import-dir src \
            /Shared/databricks-sales-pipeline/src --overwrite

      # ---- CONFIG → VOLUMES ----
      - name: Upload config files to Volume
        run: |
          databricks fs mkdirs dbfs:/Volumes/dev_catalog/pipelines/configs || true
          databricks fs cp configs/dev.yaml \
            dbfs:/Volumes/dev_catalog/pipelines/configs/dev.yaml --overwrite

      # ---- JOB UPDATE ----
      - name: Update Databricks Job
        run: |
          echo "Updating job id: $DATABRICKS_JOB_ID"
          databricks jobs reset $DATABRICKS_JOB_ID \
            --json-file workflows/job.json
