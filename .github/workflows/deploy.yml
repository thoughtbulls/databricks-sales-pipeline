name: Deploy to Databricks

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: databricks

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Databricks CLI (legacy 0.18.0)
        run: |
          pip uninstall -y databricks databricks-cli || true
          pip install databricks-cli==0.18.0

      - name: Show Databricks CLI version
        run: |
          databricks --version

      - name: Validate Job ID
        run: |
          if [ -z "$DATABRICKS_JOB_ID" ]; then
            echo "DATABRICKS_JOB_ID is not set"
            exit 1
          fi
          echo "Using Job ID: $DATABRICKS_JOB_ID"

      - name: Verify job exists
        run: |
          databricks jobs get --job-id $DATABRICKS_JOB_ID

      - name: Clean Databricks workspace folder
        run: |
          databricks workspace delete /Shared/databricks-sales-pipeline --recursive || true

      - name: Upload repo to Databricks Workspace
        run: |
          databricks workspace import_dir . /Shared/databricks-sales-pipeline -o

      - name: Update Databricks Job
        run: |
          echo "Updating job id: $DATABRICKS_JOB_ID"
          databricks jobs reset $DATABRICKS_JOB_ID --json @workflows/job.json
