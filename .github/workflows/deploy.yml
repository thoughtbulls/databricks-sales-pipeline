name: Deploy to Databricks

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install databricks-cli

      - name: Verify workspace
        run: |
          databricks workspace ls /
          
      - name: Upload repo to Databricks Workspace
        run: |
          databricks workspace import_dir . /Shared/databricks-sales-pipeline -o
      
      - name: Configure Jobs API version
        run: |
          databricks jobs configure --version=2.1


      - name: Update Databricks Job
        run: |
          databricks jobs create --json-file workflows/job.json
