on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    env:
      ENV: ${{ inputs.env }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}


    steps:
      # -------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # -------------------------------------------------
      # 2. Python
      # -------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # =================================================
      # PART A — NEW DATABRICKS CLI (workspace / volumes)
      # =================================================
      - name: Install NEW Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | bash
          databricks version

      # ---- Workspace cleanup ----
      - name: Clean Databricks workspace folder
        run: |
          databricks workspace delete /Shared/databricks-sales-pipeline --recursive || true
          databricks workspace mkdirs /Shared/databricks-sales-pipeline

      # ---- Upload notebooks ----
      - name: Upload notebooks
        run: |
          databricks workspace import-dir notebooks \
            /Shared/databricks-sales-pipeline/notebooks \
            --overwrite

      # ---- Upload src (python only, still OK) ----
      - name: Upload src
        run: |
          databricks workspace import-dir src \
            /Shared/databricks-sales-pipeline/src \
            --overwrite

      # ---- Upload configs to Volume (NEW CLI supports dbfs:/Volumes) ----
      - name: Upload config files to Volume
        run: |
          databricks fs mkdirs dbfs:/Volumes/"${ENV}"_catalog/pipelines/configs || true
          databricks fs cp configs/"${ENV}".yaml \
            dbfs:/Volumes/"${ENV}"_catalog/pipelines/configs/"${ENV}".yaml \
            --overwrite

      # =================================================
      # PART B — LEGACY CLI (Jobs API 2.1 ONLY)
      # =================================================
      - name: Switch to LEGACY Databricks CLI
        run: |
          pip uninstall -y databricks databricks-cli || true
          sudo rm /usr/local/bin/databricks
          pip install databricks-cli==0.18.0
          databricks --version

      # ---- Enable Jobs API 2.1 ----
      - name: Configure Jobs API 2.1
        run: |
          databricks jobs configure --version=2.1

      - name: Install Python dependencies for CI
        run: |
          pip install pyyaml

      
      # - name: Render job.json
      #   run: |
      #     envsubst < workflows/job.json.tpl > workflows/job.json

      - name: Render job.json
        run: |
          python <<EOF
          import yaml

          cfg = yaml.safe_load(open("configs/${ENV}.yaml"))
          tpl = open("workflows/job.json.tpl").read()

          tpl = tpl.replace("{{ENV}}", cfg["env"])
          tpl = tpl.replace("{{JOB_NAME}}", cfg["job"]["name"])
          tpl = tpl.replace("{{SPARK_VERSION}}", cfg["cluster"]["spark_version"])
          tpl = tpl.replace("{{NODE_TYPE_ID}}", cfg["cluster"]["node_type_id"])
          tpl = tpl.replace("{{NUM_WORKERS}}", str(cfg["cluster"]["num_workers"]))

          open("workflows/job.json", "w").write(tpl)
          EOF


      # ---- Safety check ----
      - name: Verify job exists
        run: |
          databricks jobs get --job-id $DATABRICKS_JOB_ID

      # ---- Reset job (THIS IS THE KEY FIX) ----
      - name: Update Databricks Job
        run: |
          echo "Updating job id: $DATABRICKS_JOB_ID"
          databricks jobs reset --job-id $DATABRICKS_JOB_ID \
            --json-file workflows/job.json

      # ---- Triggered the job ---------
      # - name: Run Databricks Job
      #   run: |
      #     databricks jobs run-now --job-id $DATABRICKS_JOB_ID
      - name: Run Job
        run: |
          databricks jobs run-now \
            --job-id $DATABRICKS_JOB_ID \
            